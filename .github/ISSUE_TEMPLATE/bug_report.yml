name: Bug report
description: Something behaves incorrectly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please run `agent doctor` first — most issues are
        a missing credential, and its output tells us immediately.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. agent run --task-id ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `agent doctor`
      description: Redact any secrets. The command prints booleans, not keys.
      render: json
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: From `logs/agent.log` or the Space's Logs tab.
      render: shell

  - type: dropdown
    id: surface
    attributes:
      label: Where did this happen?
      options:
        - CLI (agent run)
        - Hugging Face Space
        - Local Gradio app
        - Library / import
        - Tests
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit SHA
    validations:
      required: true
