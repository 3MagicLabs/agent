version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    groups:
      # One PR per ecosystem keeps the review surface small.
      langchain:
        patterns: ["langchain*", "langgraph*", "langsmith*"]
      dev-tooling:
        patterns: ["ruff", "mypy", "pytest*", "pre-commit", "types-*", "pip-audit"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # gradio's major must match the Space's sdk_version in README.md.
      - dependency-name: gradio
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "devex"]
