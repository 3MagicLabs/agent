default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        # pre-commit runs mypy in an isolated venv. Without the runtime deps,
        # langgraph and langchain resolve to Any and the hook reports phantom
        # errors that `make types` does not - see docs/codebase-tour.md.
        additional_dependencies:
          - pydantic
          - types-requests
          - langgraph>=1.2,<2
          - langchain-core>=1.5,<2
          - langchain-openai>=1.4,<2
          - langchain-anthropic>=1.6,<2
        args: [--config-file=pyproject.toml]
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.23.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
